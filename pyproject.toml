[project]
name = "blockblaster"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "av>=13.0.0",
    "numpy>=2.4.4",
    "opencv-python>=4.13.0.92",
    "pygame-ce>=2.5.7",
    "pymobiledevice3>=9.12.0",
    "pyscrcpy",
    "torch>=2.11.0",
    "tqdm>=4.67.3",
]

[tool.uv]
# pyscrcpy pins av to <11 for its (unused-by-us) H.264 decoder. av 13's API
# surface is back-compatible for the symbols pyscrcpy imports, so we override
# the pin and keep our newer av.
override-dependencies = [
    "av>=13.0.0",
]

